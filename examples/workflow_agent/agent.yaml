providers:
  deepseek:
    type: deepseek
    api_key: env://DEEPSEEK_API_KEY
    default_model: deepseek-chat
agents:
  - name: workflow
    version: 1.0.0
    description: Approval-gated workflow automation agent
    capabilities: [workflow, approval]
    system_instructions: Follow the configured workflow and never perform external changes without approval.
    default_model: {name: workflow-model, provider: deepseek, model: deepseek-chat, required_capabilities: [chat, tools]}
    enabled_tools: [crm.lookup, crm.update]
    tool_permissions: [crm.read, crm.write]
    planning_strategy: react
    approval_policy: {require_for_side_effects: true, require_for_destructive: true, expires_seconds: 1800}
    workflow:
      nodes: [lookup, propose_update, approve, update]
      edges: [[lookup, propose_update], [propose_update, approve], [approve, update]]
    max_steps: 16

