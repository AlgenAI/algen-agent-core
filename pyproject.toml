[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "algen-agent-core"
version = "0.1.0"
description = "Provider-neutral agent runtime and orchestration framework"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0,<7",
  "structlog>=24.4,<26",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29,<1"]
redis = ["redis>=5,<6"]
transformers = ["transformers>=4.44,<5", "torch>=2.4,<3"]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
agent-core = "agent_core.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: tests requiring external credentials"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_core"]

[[tool.mypy.overrides]]
module = ["jsonschema", "yaml", "transformers", "opentelemetry.exporter.*"]
ignore_missing_imports = true
