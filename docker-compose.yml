services:
  traccia-runtime:
    build: .
    ports: ["8000:8000"]
    environment:
      TRACCIA_RUNTIME_CONFIG: /config/traccia-runtime.yaml
      TRACCIA_RUNTIME_POSTGRES_DSN: postgresql://traccia:local-only@postgres:5432/traccia_runtime
      TRACCIA_RUNTIME__STORAGE__RUN_STORE: postgres
      TRACCIA_RUNTIME__STORAGE__MEMORY_STORE: postgres
      TRACCIA_RUNTIME__STORAGE__EVENT_STORE: postgres
      TRACCIA_RUNTIME__STORAGE__AUDIT_STORE: postgres
      TRACCIA_RUNTIME__STORAGE__APPROVAL_STORE: postgres
      TRACCIA_RUNTIME__STORAGE__ARTIFACT_STORE: postgres
      TRACCIA_RUNTIME__STORAGE__TOOL_EXECUTION_STORE: postgres
      TRACCIA_RUNTIME__STORAGE__POSTGRES_DSN: env://TRACCIA_RUNTIME_POSTGRES_DSN
    volumes:
      - ./examples/minimal_agent/agent.yaml:/config/traccia-runtime.yaml:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: traccia
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: traccia_runtime
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traccia -d traccia_runtime"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
